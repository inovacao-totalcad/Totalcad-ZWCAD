<p class="zw_prompt">(exit)</p>
<p class="zw_desc">Exits the LISP interpreter and returns control to ZWCAD.</p>
<p class="zw_note">When executed, this command immediately terminates active LISP routines 
and redisplays the ZWCAD command line prompt. Unsaved data may be affected.</p>
