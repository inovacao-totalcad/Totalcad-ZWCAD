<p class="cmd_line"><font color="#186DAD"><b>(end_image)</b></font></p>
<p class="body_text">Finalizes the creation process for a dialog box image component.</p>
<p class="body_text">This routine completes the image construction sequence initiated by start_image, terminating graphical element definitions within the active dialog context.</p>
