<p class="prompt">
(dos_username)</p>
<p class="body_text">Returns user name of the current thread.  This is the name of the user currently logged onto the system.</p>
<hr align="left"/>
<p class="define_head_1">Parameters</p>
<p class="body_text">n/a</p>
<hr align="left"/>
<p class="define_head_1">Returns</p>
<p class="body_text">A string identifying the current user if  successful.<br/>
<strong>nil</strong> on  error.</p>
<hr align="left"/>
<p class="define_head_1">Example</p><table class="table-desc">
<tr>
<th>Code </th>
<th>Result </th>
</tr>
<tr>
<td>(<strong>dos_username</strong>)</td>
<td>
"roomy"</td>
</tr>
</table>
