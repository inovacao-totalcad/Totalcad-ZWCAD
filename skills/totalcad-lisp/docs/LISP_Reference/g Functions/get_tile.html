<p class="prompt">(get_tile key)</p>
<p class="body_text">Retrieve the current value of a dialog control element.</p>
<p class="body_text">Returns the content stored in the tile identified by the provided key string. Tile keys require exact case-sensitive matches.</p>
<!---bottom...
<hr align="left" />

<table class="table-desc">

<td>

<b>(<font color="#0e85e4">acad_colordlg</FONT> </B>1<B>)</B>
</TD>
<td>

Displays dialog box with color 1 (red) selected as the default.
</TD>
</tr>
<TR>
<td>

<b>(<font color="#0e85e4">acad_colordlg</FONT> </B>1 nil<B>)</B>
</TD>
<td>

</TD>
